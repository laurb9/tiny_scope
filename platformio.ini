; PlatformIO Project Configuration File
;
; Build the tiny_scope sketch for all supported boards: pio run
; Single board: pio run -e uno
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = tiny_scope
default_envs =
	uno
	teensy31
	teensylc
	adafruit_feather_m0
	esp32dev

[env]
framework = arduino
; chain+ evaluates preprocessor conditionals, so the Teensy-only <ADC.h>
; include is not dragged into other targets
lib_ldf_mode = chain+
lib_deps =
	adafruit/Adafruit SSD1306
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno

; Uno build with serial trace + short splash for the simavr smoke test
; (make sim-test / test/simavr-run.sh); not in default_envs
[env:uno_sim]
extends = env:uno
; small serial buffers: the trace's HardwareSerial must not eat the RAM the
; production build gives to the capture + display buffers
build_flags =
	-DSIMAVR_TEST
	-DSPLASH_DELAY_MS=10
	-DSERIAL_TX_BUFFER_SIZE=16
	-DSERIAL_RX_BUFFER_SIZE=16
	-DCAPTURE_SAMPLES=64

[env:teensy31]
platform = teensy
board = teensy31

[env:teensylc]
platform = teensy
board = teensylc

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0

[env:esp32dev]
platform = espressif32
board = esp32dev
