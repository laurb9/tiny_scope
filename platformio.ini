; PlatformIO Project Configuration File
;
; Build the tiny_scope sketch for all supported boards: pio run
; Single board: pio run -e uno
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = tiny_scope
default_envs =
	uno
	teensy31
	teensylc
	adafruit_feather_m0
	esp32dev

[env]
framework = arduino
; chain+ evaluates preprocessor conditionals, so the Teensy-only <ADC.h>
; include is not dragged into other targets
lib_ldf_mode = chain+
lib_deps =
	adafruit/Adafruit SSD1306
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno

[env:teensy31]
platform = teensy
board = teensy31

[env:teensylc]
platform = teensy
board = teensylc

[env:adafruit_feather_m0]
platform = atmelsam
board = adafruit_feather_m0

[env:esp32dev]
platform = espressif32
board = esp32dev
